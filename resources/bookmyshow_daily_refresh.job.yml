# Daily refresh job for the BookMyShow data platform: generate today's incremental
# synthetic data, then refresh the bronze/silver/gold pipeline on top of it.

resources:
  jobs:
    bookmyshow_daily_refresh:
      name: bookmyshow_daily_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze_schema.name}

      tasks:
        - task_key: generate_synthetic_data
          python_wheel_task:
            package_name: bookmyshow
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--bronze-schema"
              - "${resources.schemas.bronze_schema.name}"
              - "--mode"
              - "incremental"
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: generate_synthetic_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.bookmyshow_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # By default we just include the .whl file generated for the bookmyshow package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
