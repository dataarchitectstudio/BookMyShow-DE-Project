# The main pipeline for BookMyShow_dlt_001

resources:
  pipelines:
    BookMyShow_dlt_001_etl:
      name: BookMyShow_dlt_001_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/BookMyShow_dlt_001_etl"

      libraries:
        - glob:
            include: ../src/BookMyShow_dlt_001_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
