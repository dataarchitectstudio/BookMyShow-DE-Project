[project]
name = "bookmyshow-analytics"
version = "0.1.0"
description = "BookMyShow movie-ticketing medallion lakehouse: synthetic booking data, bronze/silver/gold pipeline, semantic model, and executive dashboard."
authors = [{ name = "dataarchitectstudio@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "faker>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
    "faker>=25.0.0",
]

[project.scripts]
main = "bookmyshow_analytics.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# `spark` / `dbutils` are injected globally by the Databricks notebook and
# Lakeflow pipeline runtimes -- never imported in that code.
builtins = ["spark", "dbutils"]
