name: Deploy to Databricks (CD)

on:
  push:
    branches:
      - main

concurrency:
  group: databricks-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bundle to prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        id: setup_cli
        uses: databricks/setup-cli@v1.12.1
        continue-on-error: true

      - name: Install Databricks CLI (retry)
        if: steps.setup_cli.outcome == 'failure'
        uses: databricks/setup-cli@v1.12.1

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Deploy bundle
        run: databricks bundle deploy --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy governed metric views
        # Metric views have no native DABs bundle resource type, so `bundle deploy`
        # above never touches them -- this replaces the manual substitute-and-execute
        # runbook step. Idempotent (CREATE OR REPLACE VIEW), safe on every deploy.
        # catalog/gold-schema/warehouse-id must match the prod target vars in databricks.yml.
        run: >
          uv run --with databricks-sdk python scripts/deploy_metric_views.py
          --catalog bookmyshow_analytics_prod
          --gold-schema gold
          --warehouse-id 3a9e8611697fbf8a
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
