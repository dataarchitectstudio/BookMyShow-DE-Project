# Declarative Automation Bundle for the BookMyShow Analytics lakehouse:
# synthetic booking data -> medallion pipeline (bronze/silver/gold) -> semantic
# model -> executive AI/BI dashboard.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bookmyshow_analytics
  uuid: d1108889-5961-4b38-839f-e105821ab60f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
# The medallion schema names (raw/bronze/silver/gold) are fixed -- see resources/ --
# only the catalog differs per environment, so dev and prod are fully isolated.
variables:
  catalog:
    description: Unity Catalog catalog that holds the raw/bronze/silver/gold schemas
  warehouse_id:
    description: Serverless SQL warehouse used by the dashboard and metric view
    default: 3a9e8611697fbf8a
  schema:
    description: Scratch schema used only by the unrelated liquid_clustering_demo job

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-698fb84c-be59.cloud.databricks.com
    variables:
      catalog: bookmyshow_analytics_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-698fb84c-be59.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dataarchitectstudio@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dataarchitectstudio@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bookmyshow_analytics_prod
      schema: prod
    permissions:
      - user_name: dataarchitectstudio@gmail.com
        level: CAN_MANAGE
